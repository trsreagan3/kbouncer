# .goreleaser.yml — kbounce release pipeline
#
# Triggered on: push of a v* tag (see .github/workflows/release.yml).
# Snapshot validation: goreleaser release --snapshot --clean (no publish).
# Config check:       goreleaser check
#
# Note: canonical binary = `kbounce`; module path = github.com/trsreagan3/kbouncer
# (unchanged for v1.0 per [[bounce-suite-rename]]). The `kbouncer` shim binary
# is bundled alongside `kbounce` in the archive for v1.0; removed in v1.1.
#
# Produces per tagged release:
#   .tar.gz / .zip  → linux/darwin/windows, amd64/arm64
#   .deb / .rpm     → linux amd64 + arm64
#   docker          → ghcr.io/trsreagan3/kbounce linux/amd64 + linux/arm64
#   brew            → trsreagan3/homebrew-tap Formula/kbounce.rb
#   scoop           → trsreagan3/scoop-bucket bucket/kbounce.json
#
# NOTE: deb/rpm artifacts are attached to GitHub Releases; NOT published to a
# public APT/RPM registry (follow-up post-v1.0 work).
# Per [[vendor-integration-claim-qualifier]]: built + smoke-tested in CI;
# NOT published to public deb/rpm package registry.
#
# PREREQUISITES before the first real tagged release:
#   1. Create https://github.com/trsreagan3/homebrew-tap (public repo,
#      stub Formula/ dir). Secret: HOMEBREW_TAP_TOKEN (repo scope PAT).
#   2. Create https://github.com/trsreagan3/scoop-bucket (public repo,
#      stub bucket/ dir). Secret: SCOOP_BUCKET_TOKEN (repo scope PAT).
#   3. Confirm ghcr.io/trsreagan3/kbounce package visibility on GitHub.
#   4. DO NOT push a v* tag until launch readiness is confirmed.

version: 2

project_name: kbounce

before:
  hooks:
    - go mod tidy

# ── Builds ────────────────────────────────────────────────────────────────────
builds:
  - id: kbounce
    binary: kbounce
    main: ./cmd/kbounce
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Stamp the three vars declared in internal/cli/cli.go.
      # Use .ShortCommit (7-char SHA) to match what the Makefile + Dockerfile emit.
      - -s -w
      - -X github.com/trsreagan3/kbouncer/internal/cli.version={{.Version}}
      - -X github.com/trsreagan3/kbouncer/internal/cli.commit={{.ShortCommit}}
      - -X github.com/trsreagan3/kbouncer/internal/cli.buildTime={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # windows: syscall.Statfs_t in internal/audit/rotation.go is unix-only;
    # windows builds require adding a build-tag guard first. Tracked as
    # follow-up work — add back once rotation.go has a //go:build !windows stub.

  # Deprecation shim: ships alongside kbounce for v1.0 only.
  # Removed in v1.1 per [[bounce-suite-rename]].
  - id: kbouncer-shim
    binary: kbouncer
    main: ./cmd/kbouncer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/trsreagan3/kbouncer/internal/cli.version={{.Version}}
      - -X github.com/trsreagan3/kbouncer/internal/cli.commit={{.ShortCommit}}
      - -X github.com/trsreagan3/kbouncer/internal/cli.buildTime={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# ── Archives ──────────────────────────────────────────────────────────────────
archives:
  - id: kbounce-archive
    ids:
      - kbounce
      - kbouncer-shim
    name_template: "kbounce_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# ── Checksums ─────────────────────────────────────────────────────────────────
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ── Native packages (deb + rpm) ───────────────────────────────────────────────
nfpms:
  - id: kbounce-deb-rpm
    package_name: kbounce
    ids:
      - kbounce
    vendor: trsreagan3
    homepage: https://github.com/trsreagan3/kbouncer
    maintainer: trsreagan3
    description: |
      Kubernetes API-call gating proxy for AI agents and dev workflows.
      kbounce sits between kubectl/Helm/agent tooling and the real kube-apiserver,
      auditing every call and (optionally) denying out-of-profile requests.
    license: Apache-2.0
    section: net
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/kbounce/copyright
      - src: README.md
        dst: /usr/share/doc/kbounce/README.md
    scripts:
      postinstall: scripts/nfpm/postinstall.sh

# ── Homebrew tap ──────────────────────────────────────────────────────────────
# Writes Formula/kbounce.rb to trsreagan3/homebrew-tap on release.
# Requires HOMEBREW_TAP_TOKEN secret. Tap repo must exist first.
# NOTE: goreleaser free tier uses `brews` (goreleaser Pro uses `homebrew`).
# `brews` is deprecated upstream but remains the only non-Pro stanza in v2.
brews:
  - name: kbounce
    repository:
      owner: trsreagan3
      name: homebrew-tap
      branch: "bump-kbounce-{{.Version}}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: trsreagan3
          name: homebrew-tap
          branch: main
    homepage: https://github.com/trsreagan3/kbouncer
    description: "Kubernetes API-call gating proxy for AI agents and dev workflows"
    license: Apache-2.0
    install: |
      ldflags = %W[
        -s -w
        -X github.com/trsreagan3/kbouncer/internal/cli.version=#{version}
        -X github.com/trsreagan3/kbouncer/internal/cli.commit=homebrew
        -X github.com/trsreagan3/kbouncer/internal/cli.buildTime=#{time.iso8601}
      ]
      system "go", "build", "-trimpath", "-ldflags", ldflags.join(" "), "-o", bin/"kbounce", "./cmd/kbounce"
      system "go", "build", "-trimpath", "-ldflags", ldflags.join(" "), "-o", bin/"kbouncer", "./cmd/kbouncer"
    test: |
      assert_match version.to_s, shell_output("#{bin}/kbounce --version")
      assert_match "kbounce", shell_output("#{bin}/kbounce --help")

# ── Scoop bucket ──────────────────────────────────────────────────────────────
# Writes bucket/kbounce.json to trsreagan3/scoop-bucket on release.
# Requires SCOOP_BUCKET_TOKEN secret. Bucket repo must exist first.
scoops:
  - repository:
      owner: trsreagan3
      name: scoop-bucket
      branch: "bump-kbounce-{{.Version}}"
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: trsreagan3
          name: scoop-bucket
          branch: main
    name: kbounce
    homepage: https://github.com/trsreagan3/kbouncer
    description: "Kubernetes API-call gating proxy for AI agents and dev workflows"
    license: Apache-2.0

# ── Docker images ─────────────────────────────────────────────────────────────
# Uses Dockerfile.goreleaser (distroless; goreleaser copies the binary in).
# KEEP PRIVATE: visibility is controlled on GHCR, not here.
# Images will NOT be pushed until a real tag triggers the release workflow.
dockers:
  - id: kbounce-linux-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/trsreagan3/kbounce:{{ .Version }}-amd64"
      - "ghcr.io/trsreagan3/kbounce:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/trsreagan3/kbouncer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.title=kbounce"
      - "--label=org.opencontainers.image.description=Local Kubernetes API-call gating proxy"

  - id: kbounce-linux-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/trsreagan3/kbounce:{{ .Version }}-arm64"
      - "ghcr.io/trsreagan3/kbounce:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/trsreagan3/kbouncer"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.title=kbounce"
      - "--label=org.opencontainers.image.description=Local Kubernetes API-call gating proxy"

docker_manifests:
  - name_template: "ghcr.io/trsreagan3/kbounce:{{ .Version }}"
    image_templates:
      - "ghcr.io/trsreagan3/kbounce:{{ .Version }}-amd64"
      - "ghcr.io/trsreagan3/kbounce:{{ .Version }}-arm64"

  - name_template: "ghcr.io/trsreagan3/kbounce:latest"
    image_templates:
      - "ghcr.io/trsreagan3/kbounce:latest-amd64"
      - "ghcr.io/trsreagan3/kbounce:latest-arm64"

# ── Release ───────────────────────────────────────────────────────────────────
release:
  github:
    owner: trsreagan3
    name: kbouncer
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto

# ── Changelog ─────────────────────────────────────────────────────────────────
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
