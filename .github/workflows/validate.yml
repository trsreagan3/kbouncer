name: validate

# Runs go vet + go test on every push + PR. The same checks every
# release pipeline depends on. Mirrors gbounce's validate.yml so the
# whole Bounce suite has test-CI parity (see iam-jit memory
# project_bouncer_ui_test_gap_2026_06_02: kbouncer + dbounce previously
# had no test CI, which let a broken UI filter ship unguarded).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test ./... -race -count=1
