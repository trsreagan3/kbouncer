# kbounce default profiles.
#
# Profiles are environment-aware deny layers that fire BEFORE per-task
# scopes and global rules. A profile deny is a hard floor — a permissive
# task scope cannot override it. Pick the profile that matches what
# you're doing with `--profile NAME` or `KBOUNCER_PROFILE=NAME`.
#
# Edit freely: kbounce NEVER overwrites this file once it exists. To
# regenerate from defaults, delete the file and rerun `kbounce run`.
#
# Only TWO profiles ship as built-in defaults:
#
#   full-user   passthrough (no rules); calls forwarded as-is + audit-
#               logged. The default when no --profile / KBOUNCER_PROFILE
#               is set. Opt out into `readonly` for write protection.
#   readonly    blocks write + destructive verbs (delete, patch, create,
#               update, deletecollection, exec, portforward, attach).
#               General-purpose safety net — works in any environment
#               (not just prod).
#
# Community profiles (dev-only / staging-work / incident-response /
# sandbox / etc.) ship separately under `community-profiles/` in the
# kbounce repo. Install with:
#
#   kbounce profile install --from https://example.com/profile.yaml
#
# See `kbounce profile list` for the active profile + what each profile
# covers.
profiles:

  full-user:
    description: "No profile active; calls forwarded as-is + audit-logged. Default."
    # full-user is a sentinel — zero deny rules. Use this when you want
    # only per-task scopes + global rules to drive verdicts. The proxy
    # synthesizes this profile automatically even if you delete it from
    # this file, so name lookup for "full-user" always succeeds.

  readonly:
    description: "Read-only safety net — blocks write + destructive verbs in any environment."
    deny_verbs:
      - delete
      - patch
      - create
      - update
      - deletecollection
      # Subresource verbs that mutate or escalate:
      - exec
      - portforward
      - attach
